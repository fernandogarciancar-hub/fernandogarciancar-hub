<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Profesional</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* ===== ESTILOS GENERALES ===== */
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background: rgba(0, 0, 0, 0.6);
            position: fixed;
            width: 100%;
            top: 0;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        header a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-weight: 600;
        }

        header a:hover {
            color: #00d4ff;
        }

        .logo {
            font-size: 22px;
            color: #fff;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* ===== SECCIÓN HERO ===== */
        .hero {
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1400&q=60') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 25px;
            background: #00d4ff;
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: .3s;
        }

        .btn:hover {
            background: #fff;
            transform: scale(1.05);
        }

        /* ===== SOBRE MÍ ===== */
        #sobre-mi {
            padding: 100px 40px;
            text-align: center;
            background: #fff;
        }

        #sobre-mi img {
            width: 180px;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .skill {
            background: #00d4ff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            color: #000;
        }

        /* ===== PORTAFOLIO ===== */
        #portafolio {
            padding: 80px 40px;
            background: #f0f7fa;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            overflow: hidden;
            text-align: left;
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .card img {
            width: 100%;
            border-radius: 12px;
            height: 160px;
            object-fit: cover;
        }

        .card h3 {
            margin: 15px 0 5px;
        }

        .card p {
            font-size: 15px;
        }

        .card .btn {
            margin-top: 10px;
            display: inline-block;
        }

        /* ===== CONTACTO ===== */
        #contacto {
            padding: 80px 40px;
            background: #fff;
            text-align: center;
        }

        form {
            max-width: 500px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input, textarea {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 16px;
        }

        textarea {
            height: 120px;
        }

        footer {
            background: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        .social-icons a {
            color: #00d4ff;
            margin: 0 10px;
            font-size: 20px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <header>
        <div class="logo">Mi Portfolio</div>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#sobre-mi">Sobre mí</a>
            <a href="#portafolio">Portafolio</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <!-- ===== HERO ===== -->
    <section class="hero" id="inicio">
        <h1>Tu Nombre Aquí</h1>
        <p>Desarrollador Web | Diseñador | Creador Digital</p>
        <a href="#portafolio" class="btn">Ver Portafolio</a>
    </section>

    <!-- ===== SOBRE MÍ ===== -->
    <section id="sobre-mi">
        <h2>Sobre Mí</h2>
        <img src="https://i.pravatar.cc/300" alt="Foto personal">

        <p>Soy un desarrollador apasionado por crear experiencias digitales modernas, funcionales y atractivas.</p>

        <div class="skills">
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill">JavaScript</span>
            <span class="skill">Diseño UI/UX</span>
        </div>
    </section>

    <!-- ===== PORTAFOLIO ===== -->
    <section id="portafolio">
        <h2>Mis Proyectos</h2>

        <div class="grid">

            <!-- Proyecto 1 -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1522199710521-72d69614c702?auto=format&fit=crop&w=800&q
