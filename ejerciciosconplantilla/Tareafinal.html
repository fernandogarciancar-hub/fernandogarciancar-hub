<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Profesional</title>

    <!-- Tipografías modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0EA5E9;
            --dark: #0F172A;
            --light: #F8FAFC;
            --text: #334155;
            --radius: 14px;
        }

        * {
            margin: 0; 
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--light);
            color: var(--text);
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        header {
            position: fixed;
            width: 100%;
            top: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            padding: 18px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 999;
        }

        .logo {
            color: white;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 1px;
        }

        nav a {
            color: #cbd5e1;
            margin-left: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: .3s;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* ===== HERO ===== */
        .hero {
            height: 100vh;
            background: linear-gradient(
                rgba(10, 20, 50, 0.6),
                rgba(10, 20, 50, 0.6)
            ), 
            url("https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1600&q=60") center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10%;
            color: white;
        }

        .hero h1 {
            font-size: 60px;
            font-weight: 800;
            max-width: 700px;
        }

        .hero p {
            font-size: 22px;
            max-width: 600px;
            margin: 20px 0;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: var(--primary);
            color: white;
            border-radius: var(--radius);
            font-weight: 600;
            text-decoration: none;
            transition: .25s;
            margin-top: 12px;
        }

        .btn:hover {
            background: white;
            color: var(--dark);
            transform: translateY(-3px);
        }

        /* ===== SOBRE MI ===== */
        section {
            padding: 100px 60px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 800;
            color: var(--dark);
            text-align: center;
        }

        #sobre-mi .content {
            max-width: 900px;
            margin: auto;
            text-align: center;
        }

        #sobre-mi img {
            width: 180px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
